name: Portfolio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Production browser QA
        env:
          PORTFOLIO_URL: http://127.0.0.1:4173
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent "$PORTFOLIO_URL" > /dev/null && break
            sleep 1
          done
          curl --fail --silent "$PORTFOLIO_URL" > /dev/null
          npm run qa:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-qa-failure
          path: |
            .qa/*.png
            .qa/*.json
            /tmp/portfolio-preview.log
          retention-days: 7
