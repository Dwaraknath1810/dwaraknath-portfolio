name: Cinematic portfolio checks
on:
  push:
    branches:
      - feature/original-five-scene-cinematic-story
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Portfolio asset, provenance and privacy checks
        run: node scripts/validate-portfolio.mjs
      - name: ESLint
        run: npm run lint
      - name: TypeScript and production build
        run: npm run build
